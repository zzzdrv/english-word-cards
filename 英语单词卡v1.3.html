function escapeRegExp(v){return v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}

    <script>

/* ============ 评分（与 1.0 版 rateCard 一致） ============ */
function rateCard(cardId,rating,today){const p=DB.progress[cardId]||(DB.progress[cardId]=blankProgress());let level=p.level,vagueStreak=p.vagueStreak,lapses=p.lapses,hardStreak=p.hardStreak,knownCount=p.knownCount;let interval=1;if(rating==="known"){knownCount+=1;vagueStreak=0;hardStreak=0;level=Math.min(5,level+1);interval=level===1?1:level===2?3:level===3?7:level===4?15:p.level===5?60:30}else if(rating==="fuzzy"){vagueStreak+=1;hardStreak+=1;if(vagueStreak>=2){level=Math.max(0,level-1);vagueStreak=0}interval=1}else{lapses+=1;hardStreak+=1;vagueStreak=0;level=p.level===0?0:Math.max(0,p.level-2);interval=1}const masteredNow=p.level<4&&level>=4;const nowIso=new Date().toISOString();p.level=level;p.next=addDays(today,interval);p.lapses=lapses;p.hardStreak=hardStreak;p.vagueStreak=vagueStreak;p.knownCount=knownCount;if(!p.learnedAt)p.learnedAt=nowIso;p.masteredAt=masteredNow?nowIso:(level<4?null:p.masteredAt);p.lastReviewedAt=nowIso;saveDB();return{level,nextReview:p.next,hard:lapses>=3,masteredNow}}

/* ============ 背景音乐（Web Audio 现场合成 ambient pad，不用音频文件） ============ */
let musicCtx=null,musicMaster=null,musicTimer=null,musicStep=0,musicDuck=false;

/* ============ 环境声（Web Audio 现场合成噪声场景，不用音频文件；与背景音乐各用独立 AudioContext，可同时叠加、互不干扰） ============ */
const AMBIENT_SCENES=["rain","coast","fire","wind"];
const AMB_BASE=0.4;

function ambientSetting(){const v=settings().ambient;return AMBIENT_SCENES.indexOf(v)>=0?v:"off"}
function rampAmbient(){if(!ambCtx||!ambMaster)return;ambMaster.gain.setTargetAtTime(ambDuck?AMB_BASE*0.3:AMB_BASE,ambCtx.currentTime,0.35)}

function ambNoiseBuffer(ctx){const len=ctx.sampleRate*4;const buf=ctx.createBuffer(1,len,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return buf}

function ambChain(nodes,cleanup){return{stop:function(){nodes.forEach(n=>{try{n.stop()}catch(e){}});if(cleanup)cleanup()}}}
function buildRainScene(ctx,buf,out){const src=ambNoise(ctx,buf);const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1050;lp.Q.value=0.3;const hp=ctx.createBiquadFilter();hp.type="highpass";hp.frequency.value=220;const g=ctx.createGain();g.gain.value=0.6;src.connect(lp);lp.connect(hp);hp.connect(g);g.connect(out);const hiss=ambNoise(ctx,buf);hiss.playbackRate.value=0.63;const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=5400;bp.Q.value=0.4;const hg=ctx.createGain();hg.gain.value=0.13;hiss.connect(bp);bp.connect(hg);hg.connect(out);return ambChain([src,hiss])}

function buildAmbientScene(ctx,name,buf,out){return name==="rain"?buildRainScene(ctx,buf,out):name==="coast"?buildCoastScene(ctx,buf,out):name==="fire"?buildFireScene(ctx,buf,out):buildWindScene(ctx,buf,out)}

function drawStarMap(){const cv=document.getElementById("star-map");if(!cv)return;const ctx=cv.getContext("2d");if(!ctx)return;const dpr=window.devicePixelRatio||1;const w=cv.clientWidth||320;const h=240;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,"#0a0f26");bg.addColorStop(1,"#16224d");ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(const c of allCards()){const hs=starHash(c.id);const x=(hs%10000)/10000*w;const y=((hs/10000|0)%10000)/10000*h;if(c.level>=4){const gold=starIsGold(c);ctx.beginPath();ctx.fillStyle=gold?"#ffd34d":"#ffffff";ctx.shadowColor=gold?"rgba(255,211,77,.9)":"rgba(255,255,255,.85)";ctx.shadowBlur=gold?10:7;ctx.arc(x,y,gold?2.3:1.8,0,6.2832);ctx.fill();ctx.shadowBlur=0}else if(c.level>=1){ctx.beginPath();ctx.fillStyle="rgba(178,196,255,"+(0.3+c.level*0.13)+")";ctx.arc(x,y,1.1,0,6.2832);ctx.fill()}else{ctx.beginPath();ctx.fillStyle="rgba(150,160,190,.28)";ctx.arc(x,y,0.8,0,6.2832);ctx.fill()}}}

function saveCheckpoint(){if(studyKind!=="today"||phase!=="study")return;if(!queue.length||qIndex>=queue.length){clearCheckpoint();return}DB.checkpoint={date:today,queueIds:queue.map(c=>c.id),remainingIds:queue.slice(qIndex).map(c=>c.id),qIndex:qIndex,elapsed:elapsed,weak:Object.assign({},weak),confirmedKnown:confirmedKnown.slice(),reviewedCount:reviewedCount,masteredDelta:masteredDelta,studyMode:studyMode,startedAt:startedAt?startedAt.toISOString():null};saveDB()}

function goToToday(){stopSpeak();maybeDailySnapshot();phase="home";tab="today";drill=null;detailCard=null;stopTimer();render()}
function startStudy(custom){if(custom){studyKind="custom"}else{studyKind="today";clearCheckpoint()}const cards=activeCardsList();const d=computeDerived(cards);let base=custom?custom.slice():[...d.due,...d.fresh.slice(0,settings().newWordsPerDay)];if(!base.length&&!custom)base=d.early.slice(0,Math.max(3,settings().newWordsPerDay));queue=base;qIndex=0;clue=0;studyMode="front";weak={};weakRefills={};confirmedKnown=[];elapsed=0;startedAt=new Date();masteredDelta=0;reviewedCount=0;phase="study";tab="today";mnemonicOpen=false;render();startTimer()}
function advanceCurrent(){stopSpeak();const cards=activeCardsList();const d=computeDerived(cards);const next=qIndex+1;if(next>=queue.length&&elapsed<goalSeconds()){const more=d.fresh.filter(c=>!queue.some(q=>q.id===c.id)).slice(0,settings().newWordsPerDay);const add=more.length?more:d.early.filter(c=>!queue.some(q=>q.id===c.id)).slice(0,5);if(add.length)queue=queue.concat(add);else{const seenRefill={};const refill=[];for(const c of queue){if(weak[c.id]&&!confirmedKnown.includes(c.id)&&(weakRefills[c.id]||0)<2&&!seenRefill[c.id]){seenRefill[c.id]=1;refill.push(c);if(refill.length>=4)break}}refill.forEach(c=>{weakRefills[c.id]=(weakRefills[c.id]||0)+1});if(refill.length)queue=queue.concat(refill)}}qIndex=next;clue=0;studyMode="front";mnemonicOpen=false;render();saveCheckpoint()}
function currentCard(){return queue[qIndex]}
function revealForConfirmation(){if(!currentCard())return;studyMode="confirm";render()}
function confirmKnown(){const card=currentCard();if(!card||studyMode!=="confirm")return;const result=rateCard(card.id,"known",today);if(result.masteredNow){playCelebration(settings().sound);starToast="⭐ 点亮一颗星："+card.en;setTimeout(()=>{starToast="";const el=document.getElementById("star-toast");if(el)el.remove()},2800)}else playTone("known",settings().sound);if(!confirmedKnown.includes(card.id))confirmedKnown.push(card.id);delete weak[card.id];reviewedCount+=1;if(result.masteredNow)masteredDelta+=1;syncCard(card.id);advanceCurrent()}
function markUnknown(){const card=currentCard();if(!card||studyMode==="learning")return;playTone("unknown",settings().sound);weak[card.id]=Math.max(weak[card.id]||0,2);rateCard(card.id,"unknown",today);reviewedCount+=1;syncCard(card.id);queue=queue.concat([getCard(card.packId,{id:card.rawId,en:card.en,phonetic:card.phonetic,pos:card.pos,zh:card.zh,examples:[{en:card.exampleEn,zh:card.exampleZh}],image:card.imageUrl||undefined})]);studyMode="learning";render();saveCheckpoint()}
function syncCard(cardId){const fresh=getCardById(cardId);if(!fresh)return;queue=queue.map(c=>c.id===cardId?fresh:c)}
function getCardById(cardId){const idx=cardId.indexOf(":");const packId=cardId.slice(0,idx);const raw=packCards(packId).find(r=>packId+":"+r.id===cardId);return raw?getCard(packId,raw):null}
function skipCurrent(){if(studyMode!=="front")return;advanceCurrent()}
function persistMnemonic(){const card=currentCard();if(!card)return;const p=DB.progress[card.id]||(DB.progress[card.id]=blankProgress());p.mnemonic=mnemonicDraft.trim().slice(0,500);saveDB();mnemonicOpen=false;syncCard(card.id);render()}
function beginQuiz(){const weakIds=Object.keys(weak);let source;if(weakIds.length){source=weakIds.sort((a,b)=>(weak[b]||0)-(weak[a]||0)).map(id=>queue.find(c=>c.id===id)).filter(Boolean).slice(0,10)}else{source=randomSample(confirmedKnown.map(id=>queue.find(c=>c.id===id)).filter(Boolean),3)}quiz=source;quizIndex=0;quizCorrect=0;quizFeedback=null;quizInput="";quizSpoken=-1;stopTimer();clearCheckpoint();phase="quiz";render();startConfetti(true)}
function answerQuiz(answer){const card=quiz[quizIndex];if(!card||quizFeedback!==null)return;const norm=s=>s.trim().toLowerCase().replace(/[.!?'’]/g,"");let correct=norm(answer)===norm(card.en)||answer===card.zh;if(!correct&&quizIndex%4===2&&!/\s/.test(card.en.trim())){const accepted=new Set(wordForms(card.en).map(norm));const surf=clozeSurfaceForm(card.exampleEn,card.en);if(surf)accepted.add(norm(surf));correct=accepted.has(norm(answer))}quizFeedback=correct;lastQuizWasCorrect=correct;playTone(correct?"correct":"wrong",settings().sound);if(correct)quizCorrect+=1;else markQuizMiss(card.id,today);render()}
function maybeSpeakQuiz(){if(quizFeedback!==null||quizIndex%4!==3||quizSpoken===quizIndex)return;const card=quiz[quizIndex];if(!card)return;quizSpoken=quizIndex;speak(card.en)}
function nextQuiz(){stopSpeak();if(quizIndex+1<quiz.length){quizIndex+=1;quizFeedback=null;quizInput="";render();return}playCelebration(settings().sound);const end=new Date();DB.sessions.push({sessionDate:today,startedAt:(startedAt||end).toISOString(),endedAt:end.toISOString(),studySeconds:elapsed,reviewedCount,masteredDelta,weakCount:Object.keys(weak).length,quizCorrect:quizCorrect,quizTotal:quiz.length});saveDB();doneQuote=QUOTES[(new Date().getDate()+quizCorrect)%QUOTES.length];phase="done";render();startConfetti(false)}
function goHome(){maybeDailySnapshot();phase="home";stopTimer();render()}

/* ============ 渲染 ============ */
function render(){stopTimer();if(phase==="study"){app.innerHTML=studyHtml();startTimer()}else if(phase==="quiz"){app.innerHTML=quizHtml();maybeSpeakQuiz()}else if(phase==="done"){app.innerHTML=doneHtml()}else{app.innerHTML=homeHtml()}if(phase==="home"&&tab==="stats"&&!drill&&!detailCard)drawStarMap();window.scrollTo(0,0)}
function homeHtml(){const cards=activeCardsList();const d=computeDerived(cards);let body="";if(detailCard)body=wordDetailHtml();else if(drill)body=drillHtml(cards,d);else if(tab==="today")body=todayHtml(cards,d);else if(tab==="stats")body=statsHtml(cards,d);else if(tab==="packs")body=packsHtml();else if(tab==="hard")body=hardHtml(d.hard);else body=settingsHtml();const nav=[["today","play","今日"],["stats","chart","统计"],["packs","stack","卡包"],["hard","hard","难词"],["settings","gear","设置"]].map(([id,ic,label])=>'<button class="'+(tab===id?"active":"")+'" onclick="switchTab(\''+id+'\')">'+icon(ic)+"<span>"+label+"</span></button>").join("");return '<div class="app-shell"><main class="main">'+body+'</main><nav class="bottom-nav" aria-label="主导航">'+nav+"</nav></div>"}
function switchTab(id){stopSpeak();tab=id;phase="home";drill=null;detailCard=null;render()}
function todayHtml(cards,d){if(!cards.length)return '<section class="empty-main"><p class="section-label">当前词库</p><h2>先选一组要学的卡包</h2><p>卡包是原料，勾选后会组合成当前词库。</p><button class="primary" onclick="switchTab(\'packs\')">管理卡包</button></section>';const pct=Math.round(d.totalMastered/cards.length*100);if(d.allComplete)return '<section class="celebrate-page"><div class="seal">完成</div><h2>这一阶段，全部拿下</h2><p>'+cards.length+' 个词全部达到掌握线，今天也没有到期复习。</p><div class="milestones"><div><b>'+cards.length+'</b><span>总词数</span></div><div><b>'+pct+'%</b><span>掌握率</span></div><div><b>'+cards.filter(c=>c.lapses>=3&&c.level>=4).length+'</b><span>攻克难词</span></div></div><button class="primary" onclick="switchTab(\'packs\')">追加新卡包</button></section>';const latest=DB.packs.filter(p=>p.active).sort((a,b)=>b.addedOrder-a.addedOrder)[0];const cpToday=validCheckpoint();const remainToday=cpToday?checkpointRemainingIds(cpToday).length:0;return "<section>"+'<div class="today-lead"><div><p class="section-label">今日学习</p><h2>'+(d.due.length?d.due.length+" 个词等你复习":"从最新进度继续")+'</h2><p>先复习到期词，再学习最新卡包的新词。</p></div><div class="goal-ring" style="--p:'+Math.min(100,pct)+'%"><b>'+settings().dailyMinutes+'</b><span>分钟</span></div></div>'+(cpToday?'<div class="resume-panel"><p>上次学习还没完成</p><small>断点已保存，可以接着上次的进度继续，也可以重新开始今天的学习。</small><button class="primary" onclick="resumeStudy()">继续上次学习（剩余 '+remainToday+' 张）</button><button class="resume-restart" onclick="restartStudy()">重新开始</button></div>':'<button class="start-button" onclick="startJourney()"><span class="start-icon">'+icon("play")+'</span><span><b>开始今天的旅程</b><small>'+d.due.length+" 复习 · "+Math.min(d.fresh.length,settings().newWordsPerDay)+" 新词</small></span></button>")+(latest?'<div class="latest-strip"><span>最新优先</span><b>'+esc(latest.book)+" · "+esc(latest.unit)+"</b><small>"+packCardCount(latest.id)+" 词</small></div>":"")+'<div class="progress-block"><div class="progress-head"><b>当前词库</b><span>'+d.totalMastered+" / "+cards.length+' 已掌握</span></div><div class="track"><i style="width:'+pct+'%"></i></div><div class="quick-numbers"><button type="button" class="quick-num" onclick="openDrill(\'libLearned\')"><b>'+d.totalLearned+'</b><span>已学 ›</span></button><button type="button" class="quick-num" onclick="openDrill(\'libMastered\')"><b>'+d.totalMastered+'</b><span>已掌握 ›</span></button><button type="button" class="quick-num" onclick="openDrill(\'libNew\')"><b>'+(cards.length-d.totalLearned)+'</b><span>未学 ›</span></button></div></div></section>'}

function clueItems(card){const items=[];if(card.imageUrl)items.push({key:"image",html:'<div class="image-stage"><img src="'+esc(card.imageUrl)+'" alt="'+esc(card.en)+' 的记忆图片" onerror="this.parentElement.style.display=\'none\'"></div>'});if(card.mnemonic.trim())items.push({key:"mnemonic",html:'<div class="mnemonic-content"><span>助记</span><p>'+esc(card.mnemonic)+"</p></div>"});if(card.exampleEn||card.exampleZh)items.push({key:"example",html:'<div class="example"><p>'+esc(card.exampleEn)+(card.exampleEn?'<button class="speak-btn small" aria-label="朗读例句" data-t="'+esc(card.exampleEn)+'" onclick="speak(this.dataset.t)">'+icon("sound")+"</button>":"")+"</p><small>"+esc(card.exampleZh)+"</small></div>"});items.push({key:"meaning",html:'<div class="meaning"><span>'+esc(card.pos)+"</span><b>"+esc(card.zh)+"</b></div>"});return items}
function studyHtml(){const card=currentCard();const goal=goalSeconds();const mm=Math.floor(elapsed/60);const ss=String(elapsed%60).padStart(2,"0");const goalReached=elapsed>=goal;const head='<header class="study-top"><button class="back-today" onclick="goToToday()">‹ 返回今日</button><div id="study-clock">'+icon("clock")+"<b>"+mm+":"+ss+"</b><span>/ "+Math.floor(goal/60)+':00</span></div><span id="study-badge" class="'+(goalReached?"met":"adding")+'">'+(goalReached?"已达标 ✓":(qIndex>=queue.length?"基础任务完成":"专注学习中"))+"</span></header>";if(!card){if(!queue.length)return '<div class="study-shell">'+head+'<div class="study-empty"><h2>今日已完成</h2><p>今天到期的复习和新词都学完了，也没有需要提前复习的内容，明天再来。</p><button class="primary" onclick="goToToday()">回到今日</button></div></div>';return '<div class="study-shell">'+head+'<div class="study-empty"><h2>'+(goalReached?"今天学够了":"这一轮完成了")+"</h2><p>"+(goalReached?"进入测验，巩固刚才的薄弱词。":"没有更多可加量的内容，也可以进入测验。")+'</p><button class="primary" onclick="beginQuiz()">结束，进入测验</button></div></div>';}const items=clueItems(card);const fullyRevealed=studyMode!=="front";const visible=fullyRevealed?items:items.slice(0,clue);let html='<div class="study-shell">'+head+'<div class="study-progress"><i style="width:'+Math.min(100,(qIndex+1)/Math.max(1,queue.length)*100)+'%"></i><span>'+Math.min(qIndex+1,queue.length)+" / "+queue.length+"</span></div>";html+='<article class="word-card"><div class="level level-'+card.level+'">L'+card.level+" "+LEVELS[card.level]+'</div><button class="mnemonic-button" onclick="openMnemonic()">'+(card.mnemonic?"编辑助记":"助记")+'</button><div class="word-title-row"><h1>'+esc(card.en)+'</h1><button class="speak-btn" aria-label="朗读单词" onclick="speak(currentCard().en)">'+icon("sound")+'</button>'+(cardNoOf(card)?'<span class="card-no">No. '+cardNoOf(card)+"</span>":"")+"</div>";if(fullyRevealed&&card.phonetic)html+='<div class="full-phonetic"><span>'+esc(card.phonetic)+"</span></div>";html+='<div class="clue-stack">'+visible.map(i=>"<div>"+i.html+"</div>").join("")+"</div>";if(!fullyRevealed&&clue<items.length)html+='<button class="clue-button" onclick="moreClue()">再看一个线索 <span>'+(clue+1)+"/"+items.length+"</span></button>";if(fullyRevealed)html+=enrichHtml(card);html+="</article>";if(studyMode==="front")html+='<div class="rating-row"><button class="known" onclick="revealForConfirmation()"><b>会</b><span>先核对答案</span></button><button class="skip" onclick="skipCurrent()"><b>跳过</b><span>不做标记</span></button><button class="unknown" onclick="markUnknown()"><b>不会</b><span>展开学习</span></button></div>';else if(studyMode==="confirm")html+='<div class="confirm-row"><button class="known" onclick="confirmKnown()"><b>真会</b><span>升级并延长间隔</span></button><button class="unknown" onclick="markUnknown()"><b>记错了</b><span>按不会处理</span></button></div>';else html+='<button class="answer-next" onclick="advanceCurrent()">已掌握，下一个</button>';html+='<button class="finish-link" id="finish-link" style="display:'+(goalReached&&studyMode==="front"?"":"none")+'" onclick="beginQuiz()">结束，进入测验</button>';if(mnemonicOpen)html+='<div class="modal-backdrop"><div class="modal compact mnemonic-modal"><div class="modal-head"><h3>'+(card.mnemonic?"编辑助记":"添加助记")+'</h3><button aria-label="关闭" onclick="closeMnemonic()">×</button></div><p>写下联想、谐音或自己的记忆口诀。以后它会作为一条线索出现。</p><textarea id="mnemonic-input" aria-label="助记内容" maxlength="500" placeholder="例如：把发音、词根或一个场景联想写在这里">'+esc(mnemonicDraft)+"</textarea>"+(mnemonicError?'<p class="form-message">'+esc(mnemonicError)+"</p>":"")+'<div class="modal-actions"><button onclick="closeMnemonic()">取消</button><button class="mnemonic-save" onclick="persistMnemonic()">保存</button></div></div></div>';return html+(starToast?'<div class="toast" id="star-toast">'+esc(starToast)+"</div>":"")+"</div>"}
function moreClue(){const card=currentCard();if(!card)return;clue=Math.min(clueItems(card).length,clue+1);render()}
function openMnemonic(){const card=currentCard();mnemonicDraft=card?card.mnemonic:"";mnemonicError="";mnemonicOpen=true;render();const t=document.getElementById("mnemonic-input");if(t){t.focus();t.addEventListener("input",()=>{mnemonicDraft=t.value})}}
function closeMnemonic(){mnemonicOpen=false;render()}

function quizOptions(card,idx,cards){const start=(idx*3)%Math.max(1,cards.length-1);const others=cards.filter(c=>c.id!==card.id).slice(start,start+3);return [card,...others].map(c=>c.zh).sort((a,b)=>a.localeCompare(b)).slice(0,4)}
function quizHtml(){const card=quiz[quizIndex];if(!card)return '<div class="state-screen"><h2>本节没有可测验的卡</h2><button class="primary" onclick="nextQuiz()">完成</button><button class="back-today" onclick="goToToday()">‹ 返回今日</button></div>';const cards=activeCardsList();const type=quizIndex%4;const total=quiz.length;let html='<div class="quiz-shell"><header><button class="back-today" onclick="goToToday()">‹ 返回今日</button><span>巩固测验</span><b>'+(quizIndex+1)+" / "+total+'</b></header><div class="quiz-meter"><i style="width:'+((quizIndex+1)/total*100)+'%"></i></div><article class="quiz-card">';if(type===0){html+='<p class="quiz-type">选择题</p><h2>'+esc(card.en)+'</h2><div class="options">'+quizOptions(card,quizIndex,cards).map(o=>'<button '+(quizFeedback!==null?"disabled":"")+' onclick="answerQuiz(this.textContent)">'+esc(o)+"</button>").join("")+"</div>"}else if(type===1){html+='<p class="quiz-type">首字母填空</p><h2>'+esc(card.zh)+'</h2><p class="hint">'+esc(card.en.charAt(0))+Array.from({length:Math.max(0,card.en.length-1)},()=>" _").join("")+'</p><div class="answer-line"><input id="quiz-input" aria-label="输入英文答案" autocapitalize="none" value="'+esc(quizInput)+'" onkeydown="if(event.key===\'Enter\'&&this.value)answerQuiz(this.value)"><button '+(quizFeedback!==null?"disabled":"")+' onclick="answerQuiz(document.getElementById(\'quiz-input\').value)">提交</button></div>'}else if(type===2){const cloze=buildClozeSentence(card.exampleEn,card.en);html+='<p class="quiz-type">例句挖空</p>'+(card.imageUrl?'<div class="image-stage"><img src="'+esc(card.imageUrl)+'" alt="'+esc(card.en)+'" onerror="this.parentElement.style.display=\'none\'"></div>':"")+'<h2 class="cloze">'+esc(cloze)+"</h2>"+(card.exampleZh?'<p class="cloze-translation">'+esc(card.exampleZh)+"</p>":"")+'<div class="answer-line"><input id="quiz-input" aria-label="输入英文答案" autocapitalize="none" value="'+esc(quizInput)+'" onkeydown="if(event.key===\'Enter\'&&this.value)answerQuiz(this.value)"><button '+(quizFeedback!==null?"disabled":"")+' onclick="answerQuiz(document.getElementById(\'quiz-input\').value)">提交</button></div>'}else if(type===3){html+='<p class="quiz-type">听音辨词</p><p class="listen-prompt">听，是哪个词？</p><button class="listen-btn" aria-label="播放发音" onclick="speak(quiz[quizIndex].en)">'+icon("sound")+'</button><div class="options">'+quizOptions(card,quizIndex,cards).map(o=>'<button '+(quizFeedback!==null?"disabled":"")+' onclick="answerQuiz(this.textContent)">'+esc(o)+"</button>").join("")+"</div>"}if(quizFeedback!==null)html+='<div class="feedback '+(quizFeedback?"right":"wrong")+'"><b>'+(quizFeedback?"答对了":"再记一次")+"</b><span>"+esc(card.en)+" · "+esc(card.zh)+'</span><button onclick="nextQuiz()">'+(quizIndex+1===total?"查看结果":"下一题")+"</button></div>";return html+"</article></div>"}
function cheerHtml(){return '<div class="cheer-scene" role="img" aria-label="欢呼庆祝的角色"><i class="cheer-ray ray-one"></i><i class="cheer-ray ray-two"></i><i class="cheer-ray ray-three"></i><div class="cheer-character"><span class="cheer-arm arm-left"></span><span class="cheer-arm arm-right"></span><span class="cheer-head"><i></i><b></b></span><span class="cheer-body"></span><span class="cheer-leg leg-left"></span><span class="cheer-leg leg-right"></span></div><span class="cheer-shadow"></span></div>'}
function doneHtml(){const total=quiz.length;const pct=total?Math.round(quizCorrect/total*100):100;return '<div class="done-shell">'+cheerHtml()+'<p class="section-label">今日完成</p><h1>太棒了，今天的挑战拿下！</h1><div class="done-stats"><div><b>'+reviewedCount+'</b><span>练习卡片</span></div><div><b>'+Object.keys(weak).length+'</b><span>薄弱词</span></div><div><b>'+pct+'%</b><span>测验正确率</span></div></div><blockquote><p>'+esc(doneQuote[0])+"</p><span>"+esc(doneQuote[1])+'</span></blockquote><button class="primary" onclick="goHome()">回到今日</button></div>'}

function statPanel(title,learned,mastered,kind){const un=Math.max(0,learned-mastered);return '<button class="stat-panel" onclick="openDrill(\''+kind+'\')"><h3>'+title+'<span class="drill-chev">›</span></h3><div class="stat-big"><b>'+(learned?Math.round(mastered/learned*100):0)+'%</b><span>掌握率</span></div><dl><div><dt>已学</dt><dd>'+learned+'</dd></div><div><dt>已掌握</dt><dd>'+mastered+'</dd></div><div><dt>未掌握</dt><dd>'+un+"</dd></div></dl></button>"}
function statsHtml(cards,d){const packStats=DB.packs.filter(p=>p.active).map(p=>{const cs=cards.filter(c=>c.packId===p.id);return{pack:p,mastered:cs.filter(c=>c.level>=4).length,total:cs.length}});const cutoff=new Date();cutoff.setDate(cutoff.getDate()-6);const cutoffStr=localDate(cutoff);const recent=DB.sessions.filter(s=>s.sessionDate>=cutoffStr);const days=new Set(recent.map(s=>s.sessionDate)).size;const speed=days?recent.reduce((n,s)=>n+s.masteredDelta,0)/days:0;const remain=cards.length-d.totalMastered;const estimate=speed>0?Math.ceil(remain/speed):null;return "<section>"+'<p class="section-label">学习统计</p><h2>进步，要看得见</h2><div class="stat-columns">'+statPanel("今日",d.todayCards.length,d.todayMastered,"today")+statPanel("总计",d.totalLearned,d.totalMastered,"total")+'</div><button class="goal-panel" onclick="openDrill(\'goal\')"><div class="progress-head"><b>当前目标<span class="drill-chev">›</span></b><span>'+d.totalMastered+" / "+cards.length+'</span></div><div class="track"><i style="width:'+(cards.length?d.totalMastered/cards.length*100:0)+'%"></i></div><div class="goal-meta"><span>完成度 <b>'+(cards.length?Math.round(d.totalMastered/cards.length*100):0)+'%</b></span><span>预计剩余 <b>'+(estimate===null?"数据积累中":estimate+" 天")+'</b></span></div></button><h3 class="subhead">分包进度</h3><div class="pack-progress">'+packStats.map(x=>"<div class=\"pack-progress-row\"><button class=\"pack-row-btn\" onclick=\"openDrill('packs')\"><p><b>"+esc(x.pack.book)+" · "+esc(x.pack.unit)+"</b><span>"+x.mastered+"/"+x.total+'</span></p><div class="track"><i style="width:'+(x.total?x.mastered/x.total*100:0)+'%"></i></div></button>'+'<button class="pack-reset" onclick="resetUi.notice=\'\';resetUi.packId=\''+x.pack.id+'\';render()">重置</button></div>').join("")+"</div>"+starMapHtml()+resetPackExtra()+"</section>"}

const DOT_COLORS=["#e03131","#e8590c","#f28b82","#81c784","#2e7d32"];
function levelDots(level,big){let s='<span class="lvl-dots'+(big?" big":"")+'" role="img" aria-label="当前等级 L'+level+" "+LEVELS[level]+'">';for(let i=1;i<=5;i++)s+='<span class="lvl-dot'+(i<=level?"":" off")+'"'+(i<=level?' style="--dc:'+LEVEL_COLORS[level]+'"':"")+'></span>';return s+'<span class="lvl-text">Lv.'+level+"</span></span>"}
let drillFilter={level:null,query:""},drillList=[];
function setDrillLevel(lv){drillFilter.level=(lv===null||drillFilter.level===lv)?null:lv;render()}
function onDrillSearch(v){drillFilter.query=v;const wrap=document.getElementById("drill-list-wrap");if(wrap)wrap.innerHTML=wordRowsHtml();const cnt=document.getElementById("drill-count");if(cnt)cnt.textContent=drillCountText()}
function filteredDrillList(){const q=drillFilter.query.trim().toLowerCase();return drillList.filter(c=>(drillFilter.level===null||c.level===drillFilter.level)&&(!q||c.en.toLowerCase().includes(q)||(c.zh||"").toLowerCase().includes(q)))}
function drillCountText(){const n=filteredDrillList().length;if(drillFilter.level===null&&!drillFilter.query.trim())return "共 "+drillList.length+" 个单词 · 按等级从低到高，点单词看卡片";return "显示 "+n+" / 共 "+drillList.length+" 个单词 · 点单词看卡片"}
function levelCardsHtml(){let h='<div class="lvl-cards'+(drillFilter.level!==null?" has-on":"")+'">';for(let lv=0;lv<=5;lv++){const n=drillList.filter(c=>c.level===lv).length;h+='<button class="lvcard'+(drillFilter.level===lv?" on":"")+'" style="--lc:'+LEVEL_COLORS[lv]+'" onclick="setDrillLevel('+lv+')" aria-pressed="'+(drillFilter.level===lv)+'"><span class="n">L'+lv+'</span><span class="cn">'+LEVELS[lv]+'</span><span class="c">'+n+" 词</span></button>"}return h+"</div>"}
function clearDrillFilters(){drillFilter={level:null,query:""};render()}
function openDrill(kind){drill={kind:kind};detailCard=null;drillFilter={level:null,query:""};render()}
function openPackWords(packId){drill={kind:"pack",packId:packId};detailCard=null;drillFilter={level:null,query:""};render()}
function openWordDetail(id){const c=getCardById(id);if(!c)return;detailCard=c;render()}
function drillBack(){if(detailCard){detailCard=null;render();return}if(drill&&drill.kind==="pack"){drill={kind:"packs"};render();return}drill=null;render()}
function wordRowsHtml(){if(!drillList.length)return '<div class="soft-empty"><div class="empty-symbol">Aa</div><h3>这里还没有单词</h3><p>开始学习后，符合条件的单词会出现在这里。</p></div>';const sorted=filteredDrillList().sort((a,b)=>a.level-b.level||a.en.localeCompare(b.en));if(!sorted.length)return '<div class="soft-empty"><div class="empty-symbol">Aa</div><h3>没有符合条件的单词</h3><p>换个等级或搜索词试试。</p></div>';return '<div class="word-list">'+sorted.map(c=>'<button class="word-row" style="--lc:'+LEVEL_COLORS[c.level]+'" onclick="openWordDetail(\''+c.id+'\')"><span class="word-main"><b>'+esc(c.en)+'</b><span class="word-zh">'+esc(c.zh||"")+"</span></span>"+(cardNoOf(c)?'<span class="word-no">No. '+cardNoOf(c)+"</span>":"")+levelDots(c.level)+"</button>").join("")+"</div>"}
function drillHtml(cards,d){if(drill.kind==="packs"){const ps=DB.packs.filter(p=>p.active).map(p=>{const cs=cards.filter(c=>c.packId===p.id);return{pack:p,learned:cs.filter(c=>c.lastReviewedAt!=null).length,mastered:cs.filter(c=>c.level>=4).length,total:cs.length}});return '<section><button class="back-link" onclick="drillBack()">‹ 返回统计</button><p class="section-label">分包进度</p><h2>选择卡包</h2><div class="pack-pick">'+ps.map(x=>'<button class="pack-pick-row" onclick="openPackWords(\''+x.pack.id+'\')"><span class="pack-pick-head"><b>'+esc(x.pack.book)+" · "+esc(x.pack.unit)+"</b><span>"+x.mastered+" / "+x.total+' 已掌握</span></span><span class="track"><i style="width:'+(x.total?x.mastered/x.total*100:0)+'%"></i></span><span class="pack-pick-sub">已学 '+x.learned+" · 共 "+x.total+" 词</span></button>").join("")+"</div></section>"}let title="",list=[],back="返回统计";if(drill.kind==="today"){title="今日单词";list=d.todayCards}else if(drill.kind==="total"){title="累计学过";list=cards.filter(c=>c.lastReviewedAt!=null)}else if(drill.kind==="goal"){title="当前目标 · 全部单词";list=cards}else if(drill.kind==="libLearned"){title="当前词库 · 已学";list=cards.filter(c=>c.lastReviewedAt!=null);back="返回今日"}else if(drill.kind==="libMastered"){title="当前词库 · 已掌握";list=cards.filter(c=>c.level>=4);back="返回今日"}else if(drill.kind==="libNew"){title="当前词库 · 未学";list=cards.filter(c=>c.lastReviewedAt==null);back="返回今日"}else{const p=DB.packs.find(x=>x.id===drill.packId);title=p?p.book+" · "+p.unit:"卡包单词";list=cards.filter(c=>c.packId===drill.packId);back="返回卡包列表"}drillList=list;return "<section>"+'<button class="back-link" onclick="drillBack()">‹ '+back+'</button><p class="section-label">单词列表</p><h2>'+esc(title)+"</h2>"+levelCardsHtml()+'<div class="word-search"><span class="ws-ico">'+icon("search")+'</span><input id="drill-search" type="search" placeholder="搜索英文单词或中文释义" value="'+esc(drillFilter.query)+'" oninput="onDrillSearch(this.value)"><button class="ws-filter'+((drillFilter.level!==null||drillFilter.query.trim())?" active":"")+'" onclick="clearDrillFilters()" aria-label="清除等级与搜索筛选" title="清除筛选">'+icon("filter")+'</button></div><p class="drill-count" id="drill-count">'+drillCountText()+'</p><div id="drill-list-wrap">'+wordRowsHtml()+"</div></section>"}
function enrichHtml(card){if(!card)return"";let h="";const spk=t=>t?'<button class="speak-btn small" aria-label="朗读" data-t="'+esc(t)+'" onclick="speak(this.dataset.t)">'+icon("sound")+"</button>":"";if(Array.isArray(card.senses)&&card.senses.length){h+='<div class="enrich"><h4>义项</h4>'+card.senses.map(sn=>'<div class="sense"><div class="sense-head"><span>'+esc(sn.pos||"")+'</span><b>'+esc(sn.zh||"")+'</b></div>'+(sn.example&&sn.example.en?'<div class="example sense-example"><p>'+esc(sn.example.en)+spk(sn.example.en)+"</p>"+(sn.example.zh?"<small>"+esc(sn.example.zh)+"</small>":"")+"</div>":"")+"</div>").join("")+"</div>"}if(Array.isArray(card.synonyms)&&card.synonyms.length)h+='<p class="enrich-line"><span>近义词：</span>'+card.synonyms.map(x=>esc(x)).join("、")+"</p>";if(Array.isArray(card.antonyms)&&card.antonyms.length)h+='<p class="enrich-line"><span>反义词：</span>'+card.antonyms.map(x=>esc(x)).join("、")+"</p>";if(Array.isArray(card.collocations)&&card.collocations.length){h+='<div class="enrich"><h4>常用搭配</h4>'+card.collocations.map(c=>'<div class="colloc"><p>'+esc(c.en||"")+spk(c.en||"")+"</p>"+(c.zh?"<small>"+esc(c.zh)+"</small>":"")+"</div>").join("")+"</div>"}return h}
function wordDetailHtml(){const card=detailCard;const items=clueItems(card);return '<section><button class="back-link" onclick="drillBack()">‹ 返回列表</button><article class="word-card detail-card"><div class="level level-'+card.level+'">L'+card.level+" "+LEVELS[card.level]+'</div><div class="word-title-row"><h1>'+esc(card.en)+'</h1><button class="speak-btn" aria-label="朗读单词" onclick="speak(detailCard.en)">'+icon("sound")+'</button>'+(cardNoOf(card)?'<span class="card-no">No. '+cardNoOf(card)+"</span>":"")+'</div>'+(card.phonetic?'<div class="full-phonetic"><span>'+esc(card.phonetic)+"</span></div>":"")+levelDots(card.level,true)+'<div class="clue-stack">'+items.map(i=>"<div>"+i.html+"</div>").join("")+"</div>"+enrichHtml(card)+"</article></section>"}

function packsHtml(){const list=[...DB.packs].sort((a,b)=>b.addedOrder-a.addedOrder);let html="<section>"+'<div class="section-head"><div><p class="section-label">当前词库</p><h2>卡包组合</h2></div><button class="small-primary" onclick="packUi.showImport=true;render()">'+icon("upload")+' 导入卡包</button></div><p class="intro">最新追加的包优先出新词；重复英文只学习一次。</p><div class="pack-list">';for(const p of list){html+='<article class="'+(p.active?"":"muted")+'"><button class="check-toggle '+(p.active?"on":"")+'" aria-label="切换词库：'+esc(p.unit)+'" onclick="togglePack(\''+p.id+'\')">'+(p.active?icon("check"):"")+'</button><div><h3>'+esc(p.book)+" · "+esc(p.unit)+"</h3><p>v"+esc(p.version)+" · "+packCardCount(p.id)+' 词</p><small>'+new Date(p.importedAt).toLocaleDateString("zh-CN")+" 导入</small></div><div class=\"pack-actions\"><button class=\"text-update\" onclick=\"startPackUpdate('"+p.id+"')\">更新</button><button class=\"text-danger\" onclick=\"packUi.deleteId='"+p.id+"';render()\">删除</button></div></article>"}html+="</div>";if(packUi.showImport){html+='<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>导入卡包</h3><button aria-label="关闭" onclick="packUi.showImport=false;packUi.message=\'\';render()">×</button></div><p>粘贴完整 JSON，或选择 .json 文件。卡片须包含英文、词性、中文释义与例句。</p><label class="file-button">选择 JSON 文件<input type="file" accept="application/json,.json" onchange="readPackFile(event)"></label><textarea id="pack-json" aria-label="卡包 JSON" placeholder=\'{"packId":"...","cards":[...]}\'>'+esc(packUi.json)+"</textarea>"+(packUi.message?'<p class="form-message">'+esc(packUi.message)+"</p>":"")+'<button class="primary" onclick="doImportPack()">校验并导入</button></div></div>'}if(packUi.deleteId){html+='<div class="modal-backdrop"><div class="modal compact"><h3>删除卡包？</h3><p>卡包和相关学习进度会一起删除，无法撤销。</p><div class="modal-actions"><button onclick="packUi.deleteId=null;render()">取消</button><button class="danger" onclick="doDeletePack()">确认删除</button></div></div></div>'}if(packUi.updateId){const up=DB.packs.find(x=>x.id===packUi.updateId);if(up)html+='<div class="modal-backdrop"><div class="modal compact"><div class="modal-head"><h3>更新卡包</h3><button aria-label="关闭" onclick="closePackUpdate()">×</button></div><p>为《'+esc(up.book)+" · "+esc(up.unit)+'》选择新版词包 JSON 文件（packId 须为「'+esc(up.id)+'」）。按卡片逐条合并：新增的卡追加进来，内容有变化的卡被替换，新版中已删除的卡会移除；每张卡的学习进度都会保留，不受影响。</p><label class="file-button">选择 JSON 文件<input type="file" accept="application/json,.json" onchange="readUpdateFile(event)"></label>'+(packUi.updateMessage?'<p class="form-message">'+esc(packUi.updateMessage)+"</p>":"")+'<div class="modal-actions"><button onclick="closePackUpdate()">取消</button></div></div></div>'}if(packUi.notice)html+='<div class="toast">'+esc(packUi.notice)+"</div>";return html+"</section>"}
function togglePack(packId){const p=DB.packs.find(x=>x.id===packId);if(!p)return;p.active=!p.active;saveDB();render()}
function doDeletePack(){const id=packUi.deleteId;DB.packs=DB.packs.filter(p=>p.id!==id);delete DB.customPacks[id];for(const key of Object.keys(DB.progress))if(key.startsWith(id+":"))delete DB.progress[key];packUi.deleteId=null;saveDB();render()}
function readPackFile(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{packUi.json=String(reader.result||"");const t=document.getElementById("pack-json");if(t)t.value=packUi.json};reader.readAsText(f)}
function validatePack(doc){if(!doc||typeof doc!=="object")return"这不是有效的卡包 JSON";for(const f of["packId","book","unit"])if(typeof doc[f]!=="string"||!doc[f])return"缺少字段："+f;if(!Array.isArray(doc.cards)||doc.cards.length<1)return"卡包至少要有一张卡";const seen=new Set();for(const c of doc.cards){if(!c.id||!c.en||!c.zh)return"每张卡必须有 id、英文和中文释义";if(seen.has(c.id))return"卡片 id 必须唯一";seen.add(c.id);if(!Array.isArray(c.examples)||c.examples.length<1||!c.examples[0].en||!c.examples[0].zh)return"卡片「"+c.en+"」缺少例句"}return null}
function doImportPack(){const t=document.getElementById("pack-json");packUi.json=t?t.value:"";let doc;try{doc=JSON.parse(packUi.json)}catch(e){packUi.message="JSON 格式无效";render();return}const err=validatePack(doc);if(err){packUi.message=err;render();return}if(DB.packs.some(p=>p.id===doc.packId)){packUi.message="同 packId 卡包已存在，请更换版本标识";render();return}const order=DB.packs.reduce((m,p)=>Math.max(m,p.addedOrder||0),0)+1;const cards=doc.cards.map(normalizePackCard);DB.customPacks[doc.packId]={cards};DB.packs.push({id:doc.packId,book:doc.book,unit:doc.unit,version:doc.version||"1.0",createdAt:doc.createdAt||today,importedAt:new Date().toISOString(),active:true,addedOrder:order,builtin:false});saveDB();packUi.showImport=false;packUi.json="";packUi.message="";render()}

function normalizePackCard(c){const out={id:String(c.id),en:String(c.en),phonetic:c.phonetic||"",pos:c.pos||"",zh:String(c.zh),examples:(Array.isArray(c.examples)?c.examples:[]).map(x=>({en:String(x&&x.en||""),zh:String(x&&x.zh||"")}))};if(c.image)out.image=String(c.image);if(c.image_query)out.image_query=String(c.image_query);if(Array.isArray(c.senses)&&c.senses.length)out.senses=c.senses.map(sn=>({pos:String(sn&&sn.pos||""),zh:String(sn&&sn.zh||""),example:sn&&sn.example?{en:String(sn.example.en||""),zh:String(sn.example.zh||"")}:null}));if(Array.isArray(c.synonyms)&&c.synonyms.length)out.synonyms=c.synonyms.map(x=>String(x));if(Array.isArray(c.antonyms)&&c.antonyms.length)out.antonyms=c.antonyms.map(x=>String(x));if(Array.isArray(c.collocations)&&c.collocations.length)out.collocations=c.collocations.map(x=>({en:String(x&&x.en||""),zh:String(x&&x.zh||"")}));return out}
function packCardChanged(oc,nc){const a=normalizePackCard(oc),b=normalizePackCard(nc);const aq=a.image_query||"";const bq=aq?(b.image_query||""):"";return JSON.stringify([a.en,a.phonetic,a.pos,a.zh,a.examples,a.image||"",aq,a.senses||null,a.synonyms||null,a.antonyms||null,a.collocations||null])!==JSON.stringify([b.en,b.phonetic,b.pos,b.zh,b.examples,b.image||"",bq,b.senses||null,b.synonyms||null,b.antonyms||null,b.collocations||null])}
function startPackUpdate(id){packUi.updateId=id;packUi.updateMessage="";render()}
function closePackUpdate(){packUi.updateId=null;packUi.updateMessage="";render()}
function readUpdateFile(e){const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;const reader=new FileReader();reader.onload=()=>{applyPackUpdate(String(reader.result||""))};reader.onerror=()=>{packUi.updateMessage="文件读取失败，请重试";render()};reader.readAsText(f)}
function applyPackUpdate(text){const id=packUi.updateId;if(!id)return;let doc;try{doc=JSON.parse(text)}catch(e){packUi.updateMessage="JSON 格式无效";render();return}const err=validatePack(doc);if(err){packUi.updateMessage=err;render();return}if(doc.packId!==id){packUi.updateMessage="所选文件的 packId 是「"+doc.packId+"」，与当前卡包「"+id+"」不一致，已取消更新";render();return}const oldCards=packCards(id);const oldIds=new Set(oldCards.map(c=>String(c.id)));const newById=new Map(doc.cards.map(c=>[String(c.id),c]));const merged=[];let added=0,modified=0,unchanged=0,removed=0;for(const oc of oldCards){const nc=newById.get(String(oc.id));if(!nc){removed+=1;continue}if(!packCardChanged(oc,nc)){unchanged+=1;merged.push(oc)}else{modified+=1;merged.push(normalizePackCard(nc))}}for(const nc of doc.cards){if(!oldIds.has(String(nc.id))){added+=1;merged.push(normalizePackCard(nc))}}const bp=window.BUILTIN_PACKS.find(p=>p.packId===id);if(bp){DB.customPacks[id]={cards:merged,baseBuiltinVersion:bp.version}}else{DB.customPacks[id]={cards:merged}}const meta=DB.packs.find(p=>p.id===id);if(meta){meta.version=doc.version||meta.version;meta.book=doc.book;meta.unit=doc.unit}saveDB();packUi.updateId=null;packUi.updateMessage="";packUi.notice="更新成功：新增 "+added+" · 修改 "+modified+" · 未变 "+unchanged+(removed>0?" · 移除 "+removed+"（学习进度已保留）":"");render();setTimeout(()=>{if(packUi.notice){packUi.notice="";if(phase==="home"&&tab==="packs")render()}},3600)}

function hardHtml(hard){let html='<section><p class="section-label">难词本</p><h2>把反复出错的词单独拿下</h2>';if(hard.length){html+='<div class="hard-list">'+hard.map(c=>"<article><div><b>"+esc(c.en)+"</b><span>"+esc(c.zh)+"</span></div><em>L"+c.level+"</em></article>").join("")+'</div><button class="primary sticky-action" onclick="startHardReview()">复习这 '+hard.length+" 个难词</button>"}else{html+='<div class="soft-empty"><div class="empty-symbol">3×</div><h3>暂时没有难词</h3><p>累计三次“不会”的词会自动来到这里。</p></div>'}return html+"</section>"}
function startHardReview(){const cards=activeCardsList();startStudy(cards.filter(c=>c.lapses>=3))}

/* ============ 自动快照（独立 localStorage 键，与学习数据分开存放） ============ */
const SNAP_KEY="wordcards-snapshots-v1";
const MAX_SNAPSHOTS=3;
function pad2(n){return String(n).padStart(2,"0")}
function snapDayLabel(iso){const d=new Date(iso);return pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function snapTimeLabel(iso){const d=new Date(iso);return snapDayLabel(iso)+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())}
function captureState(){return JSON.parse(JSON.stringify({type:"user-data",version:"1.0",progress:DB.progress,stats:{sessions:DB.sessions},settings:DB.settings,checkpoint:DB.checkpoint||null}))}
function loadSnapshots(){try{const raw=localStorage.getItem(SNAP_KEY);if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr))return arr.filter(s=>s&&typeof s==="object"&&s.data&&s.createdAt)}}catch(e){}return[]}
function saveSnapshots(list){const trimmed=list.slice(0,MAX_SNAPSHOTS);try{localStorage.setItem(SNAP_KEY,JSON.stringify(trimmed))}catch(e){}return trimmed}
function createSnapshot(label,kind){const now=new Date();const iso=now.toISOString();let snaps=loadSnapshots();if(kind==="daily"){const ex=snaps.find(s=>s.kind==="daily"&&s.day===today);if(ex){ex.data=captureState();ex.createdAt=iso;ex.label=label;snaps=[ex].concat(snaps.filter(s=>s!==ex));saveSnapshots(snaps);return ex}}const snap={id:"snap-"+now.getTime()+"-"+Math.random().toString(36).slice(2,8),createdAt:iso,label:label,kind:kind||"manual",day:today,data:captureState()};snaps.unshift(snap);saveSnapshots(snaps);return snap}
function maybeDailySnapshot(){const rated=Object.keys(DB.progress).some(id=>{const p=DB.progress[id];return p&&p.lastReviewedAt&&localDate(new Date(p.lastReviewedAt))===today})||DB.sessions.some(s=>s.sessionDate===today);if(!rated)return;createSnapshot("每日快照 "+snapDayLabel(new Date().toISOString()),"daily")}
function saveManualSnapshot(){createSnapshot("手动快照 "+snapTimeLabel(new Date().toISOString()),"manual");settingsUi.notice="快照已保存";render();setTimeout(()=>{settingsUi.notice="";if(phase==="home")render()},2200)}
function deleteSnapshot(id){saveSnapshots(loadSnapshots().filter(s=>s.id!==id));render()}
function doRestoreSnapshot(){const id=snapshotUi.restoreId;snapshotUi.restoreId=null;const snap=loadSnapshots().find(s=>s.id===id);if(!snap){render();return}settingsUi.importText=JSON.stringify(snap.data);restoreData()}
function snapshotListHtml(){const snaps=loadSnapshots();if(!snaps.length)return '<p class="reset-note">暂无快照。完成今日学习后会自动保存每日快照；全部初始化、按卡包重置或恢复数据前也会自动保存当前状态。最多保留最近 3 份。</p>';return '<div class="snap-list">'+snaps.map(s=>'<div class="snap-row"><div class="snap-info"><b>'+esc(s.label)+'</b><small>'+esc(snapTimeLabel(s.createdAt))+' 保存</small></div><button class="snap-btn" onclick="snapshotUi.restoreId=\''+s.id+'\';render()">恢复</button><button class="snap-btn danger-text" onclick="deleteSnapshot(\''+s.id+'\')">删除</button></div>').join("")+"</div>"}

function settingsHtml(){const s=settings();const curAmb=AMBIENT_SCENES.indexOf(s.ambient)>=0?s.ambient:"off";let html='<section><p class="section-label">设置</p><h2>按你的节奏学习</h2><div class="settings-group"><h3>每日任务</h3><label>目标时长<select id="set-minutes" aria-label="目标时长">'+[10,15,20,30].map(n=>'<option value="'+n+'"'+(s.dailyMinutes===n?" selected":"")+">"+n+" 分钟</option>").join("")+'</select></label><label>每日新词 <span id="set-newwords-label">'+s.newWordsPerDay+'</span> 个<input id="set-newwords" aria-label="每日新词数" type="range" min="5" max="20" value="'+s.newWordsPerDay+'" oninput="document.getElementById(\'set-newwords-label\').textContent=this.value"></label><label class="switch-row">学习音效<button role="switch" aria-checked="'+s.sound+'" class="switch '+(s.sound?"on":"")+'" id="set-sound" onclick="this.classList.toggle(\'on\')"><i></i></button></label><label class="switch-row">开场问候<button role="switch" aria-checked="'+(s.greeting!==false)+'" class="switch '+(s.greeting!==false?"on":"")+'" id="set-greeting" onclick="this.classList.toggle(\'on\')"><i></i></button></label><label class="switch-row">背景音乐<button role="switch" aria-checked="'+(!!s.music)+'" class="switch '+(s.music?"on":"")+'" id="set-music" onclick="this.classList.toggle(\'on\')"><i></i></button></label><label>环境声<select id="set-ambient" aria-label="环境声" onchange="setAmbient(this.value)">'+[["off","关"],["rain","雨天"],["coast","海岸"],["fire","壁炉"],["wind","风声"]].map(o=>'<option value="'+o[0]+'"'+(curAmb===o[0]?" selected":"")+'>'+o[1]+"</option>").join("")+'</select></label><button class="primary" onclick="saveSettings()">保存设置</button></div>';html+='<div class="settings-group"><h3>数据备份</h3><button class="utility" onclick="exportData()">'+icon("download")+'<span><b>导出全部用户数据</b><small>进度、级别、统计与设置</small></span></button><label class="utility">'+icon("upload")+'<span><b>导入用户数据</b><small>选择备份 JSON 文件</small></span><input type="file" accept="application/json,.json" onchange="chooseBackup(event)"></label></div>';html+='<div class="settings-group"><h3>自动备份（快照）</h3><button class="primary" onclick="saveManualSnapshot()">立即保存快照</button>'+snapshotListHtml()+'</div>';html+='<div class="settings-group"><h3>数据初始化</h3><button class="danger-button" onclick="resetUi.all=true;render()">全部初始化</button><p class="reset-note">清空全部学习进度、测验记录、助记、难词本与学习断点；卡包内容和设置保留。此操作不可恢复。</p></div>';html+='<div class="settings-group about"><h3>关于</h3><p>熟练度从 L0 到 L5 动态变化；L4 计为掌握。会的词复习间隔更长，不会的词更快回炉。本单机版数据保存在本机浏览器中，换设备请先导出备份再导入恢复。</p></div>';if(resetUi.all)html+='<div class="modal-backdrop"><div class="modal compact"><h3>全部初始化？</h3><p>将清空所有卡片的学习进度、测验记录、助记、难词本与学习断点，<b>不可恢复</b>。建议先导出备份。卡包内容与设置不会受影响。</p><div class="modal-actions"><button onclick="resetUi.all=false;render()">取消</button><button class="danger" onclick="doResetAll()">确认初始化</button></div></div></div>';if(settingsUi.notice)html+='<div class="toast">'+esc(settingsUi.notice)+"</div>";if(snapshotUi.restoreId){const snap=loadSnapshots().find(x=>x.id===snapshotUi.restoreId);if(snap)html+='<div class="modal-backdrop"><div class="modal compact"><h3>恢复这份快照？</h3><p>将恢复到「'+esc(snap.label)+'」（'+esc(snapTimeLabel(snap.createdAt))+'）保存时的学习状态：快照中的卡片进度、测验记录与设置将覆盖当前数据，快照中没有的卡片进度保持不变。恢复前会自动保存一份当前状态快照。</p><div class="modal-actions"><button onclick="snapshotUi.restoreId=null;render()">取消</button><button class="danger" onclick="doRestoreSnapshot()">确认恢复</button></div></div></div>';else snapshotUi.restoreId=null}if(settingsUi.importText)html+='<div class="modal-backdrop"><div class="modal compact"><h3>用备份覆盖当前数据？</h3><p>备份中的学习进度、测验记录与设置将覆盖当前数据，统计数值会回到备份时的状态（备份中没有的卡片进度保持不变）。建议先导出当前数据。</p><div class="modal-actions"><button onclick="settingsUi.importText=null;render()">取消</button><button class="danger" onclick="restoreData()">确认导入</button></div></div></div>';return html+"</section>"}
function saveSettings(){const m=document.getElementById("set-minutes");const nw=document.getElementById("set-newwords");const sw=document.getElementById("set-sound");DB.settings.dailyMinutes=[10,15,20,30].includes(Number(m.value))?Number(m.value):15;DB.settings.newWordsPerDay=Math.max(5,Math.min(20,Number(nw.value)||8));DB.settings.sound=sw.classList.contains("on");const gr=document.getElementById("set-greeting");if(gr)DB.settings.greeting=gr.classList.contains("on");const mu=document.getElementById("set-music");if(mu)DB.settings.music=mu.classList.contains("on");const am=document.getElementById("set-ambient");if(am)DB.settings.ambient=AMBIENT_SCENES.indexOf(am.value)>=0?am.value:"off";saveDB();applyMusicSetting();applyAmbientSetting();settingsUi.notice="设置已保存";render();setTimeout(()=>{settingsUi.notice="";if(phase==="home")render()},2200)}
function exportData(){const progress={};for(const[id,p]of Object.entries(DB.progress))progress[id]={level:p.level,next:p.next,lapses:p.lapses,hardStreak:p.hardStreak,vagueStreak:p.vagueStreak,knownCount:p.knownCount,mnemonic:p.mnemonic,learnedAt:p.learnedAt,masteredAt:p.masteredAt,lastReviewedAt:p.lastReviewedAt};const doc={type:"user-data",version:"1.0",exportedAt:new Date().toISOString(),progress,stats:{sessions:DB.sessions},settings:DB.settings};const blob=new Blob([JSON.stringify(doc,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="word-cards-backup-"+today+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function chooseBackup(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const text=String(reader.result||"");let doc=null;try{doc=JSON.parse(text)}catch(err){doc=null}if(doc&&doc.type==="user-data"&&typeof doc.progress==="object"&&doc.progress){settingsUi.importText=text}else{settingsUi.importText=null;settingsUi.notice="所选文件不是有效的备份 JSON"}render()};reader.onerror=()=>{settingsUi.importText=null;settingsUi.notice="文件读取失败，请重试";render()};reader.readAsText(f,"UTF-8")}
function restoreData(){let doc;try{doc=JSON.parse(settingsUi.importText)}catch(e){settingsUi.importText=null;settingsUi.notice="备份 JSON 格式无效";render();return}if(!doc||doc.type!=="user-data"||typeof doc.progress!=="object"||!doc.progress){settingsUi.importText=null;settingsUi.notice="这不是有效的用户数据备份";render();return}createSnapshot("恢复前","pre");for(const[id,p]of Object.entries(doc.progress)){const base=blankProgress();base.level=Math.max(0,Math.min(5,Number(p.level)||0));base.next=p.next||null;base.lapses=Number(p.lapses)||0;base.hardStreak=Number(p.hardStreak)||0;base.vagueStreak=Number(p.vagueStreak)||0;base.knownCount=Number(p.knownCount)||0;base.mnemonic=typeof p.mnemonic==="string"?p.mnemonic.slice(0,500):"";base.learnedAt=p.learnedAt||null;base.masteredAt=p.masteredAt||null;base.lastReviewedAt=p.lastReviewedAt||null;DB.progress[id]=base}if(doc.stats&&Array.isArray(doc.stats.sessions))DB.sessions=doc.stats.sessions;if(doc.settings){DB.settings.dailyMinutes=[10,15,20,30].includes(doc.settings.dailyMinutes)?doc.settings.dailyMinutes:15;DB.settings.newWordsPerDay=Math.max(5,Math.min(20,Number(doc.settings.newWordsPerDay)||8));DB.settings.sound=doc.settings.sound!==false;DB.settings.greeting=doc.settings.greeting!==false;DB.settings.music=doc.settings.music===true;DB.settings.ambient=AMBIENT_SCENES.indexOf(doc.settings.ambient)>=0?doc.settings.ambient:"off"}DB.checkpoint=null;saveDB();applyAmbientSetting();settingsUi.importText=null;settingsUi.notice="用户数据已恢复";render();setTimeout(()=>{settingsUi.notice="";if(phase==="home")render()},2200)}
function doResetAll(){createSnapshot("初始化前","pre");DB.progress={};DB.sessions=[];DB.checkpoint=null;saveDB();resetUi.all=false;settingsUi.notice="已初始化：全部学习数据已清空";render();setTimeout(()=>{settingsUi.notice="";if(phase==="home")render()},2200)}
function doResetPack(){const id=resetUi.packId;resetUi.packId=null;if(id){createSnapshot("初始化前","pre");for(const key of Object.keys(DB.progress)){if(key.indexOf(id+":")===0)delete DB.progress[key]}if(DB.checkpoint){const ids=(DB.checkpoint.queueIds||[]).concat(DB.checkpoint.remainingIds||[]);if(ids.some(x=>x.indexOf(id+":")===0))DB.checkpoint=null}saveDB();resetUi.notice="已重置该卡包的学习进度"}render();setTimeout(()=>{if(resetUi.notice){resetUi.notice="";if(phase==="home"&&tab==="stats")render()}},2200)}
function resetPackExtra(){let h="";if(resetUi.packId){const p=DB.packs.find(x=>x.id===resetUi.packId);if(p)h='<div class="modal-backdrop"><div class="modal compact"><h3>重置这个卡包？</h3><p>将清空《'+esc(p.book)+" · "+esc(p.unit)+'》内全部卡片的学习进度（等级、复习计划与助记），其他卡包不受影响。此操作不可恢复，建议先在设置页导出备份。</p><div class="modal-actions"><button onclick="resetUi.packId=null;render()">取消</button><button class="danger" onclick="doResetPack()">确认重置</button></div></div></div>'}if(resetUi.notice)h+='<div class="toast">'+esc(resetUi.notice)+"</div>";return h}

render();
if(settings().music){const kickMusic=()=>{startMusic();document.removeEventListener("pointerdown",kickMusic)};document.addEventListener("pointerdown",kickMusic)}
if(ambientSetting()!=="off"){const kickAmbient=()=>{startAmbient();document.removeEventListener("pointerdown",kickAmbient)};document.addEventListener("pointerdown",kickAmbient)}
</script>
